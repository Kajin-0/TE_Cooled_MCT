name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the Python 3.12 source-geometry generation runtime.
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m tecooledmct.cli --quick --out outputs/ci-demo
      - run: python -m tecooledmct.geometry_demo --out outputs/ci-pellet
