[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "te-cooled-mct"
version = "0.1.0"
description = "Preliminary multiphysics model of a 3-stage TEC-cooled HgCdTe detector in TO-66"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]
[project.optional-dependencies]
dev = ["pytest>=7"]
fem = ["gmsh==4.13.1", "meshio==5.3.5"]
[tool.setuptools.packages.find]
include = ["tecooledmct*"]
