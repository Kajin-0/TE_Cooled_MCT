<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><style>text{font-family:Arial,sans-serif;fill:#172530} .body{fill:#d6e0e6;stroke:#233b50} .joint{fill:#d7c794;stroke:#64542c} .tab{fill:none;stroke:#a56c16;stroke-width:10}</style><rect width="1200" height="560" fill="white"/><text x="35" y="38" font-size="24">V3 corrective drawing requirement — match tabs to measured finished lands</text><text x="35" y="70" font-size="16">Analytic assembly detail, not a solved field or altered nominal STEP; vertical gaps expanded for legibility</text><g transform="translate(45,100)"><text x="10" y="20" font-size="21">Original fixed step: STOP retained</text><rect class="body" x="20" y="285" width="170" height="30"/><rect class="body" x="320" y="55" width="170" height="30"/><rect class="joint" x="70" y="260" width="65" height="25"/><rect class="joint" x="350" y="48" width="65" height="7"/><path class="tab" d="M85 260 L210 260 Q230 260 230 240 L230 68 Q230 48 250 48 L400 48"/><text x="0" y="365" font-size="17">Allowed rise 1.118 mm; fixed tab 1.100 mm</text><text x="0" y="395" font-size="17">g0 =25 µm forces g1 =7 µm: FAIL 15–25 µm</text></g><g transform="translate(640,100)"><text x="10" y="20" font-size="21">Measured-land custom form: conditional</text><rect class="body" x="20" y="285" width="170" height="30"/><rect class="body" x="320" y="55" width="170" height="30"/><rect class="joint" x="70" y="265" width="65" height="20"/><rect class="joint" x="350" y="35" width="65" height="20"/><path class="tab" d="M85 265 L210 265 Q230 265 230 245 L230 55 Q230 35 250 35 L400 35"/><text x="0" y="365" font-size="17">Form mating-face rise to measured 1.118 mm</text><text x="0" y="395" font-size="17">Both target gaps 20 µm; independent error ±5 µm</text></g><text x="35" y="535" font-size="16">Off-device forming; Rinner ≥50 µm; inspect after release; no force fit. Requirements, not demonstrated supplier capability.</text></svg>